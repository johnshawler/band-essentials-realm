<style>
/* layout: the movie's 16:9 stage, now playable, with one control bar under it. One dark look, like a screening room. */
:root { --bg: #0d1216; --bar: #161e24; --fg: #e9eef0; --muted: #94a5ad; --accent: #f59a23; --line: #2a3640; --ui: "Alegreya", Georgia, serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.3 var(--ui); overflow: hidden; }
.page { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { position: relative; width: min(100%, calc((100vh - 84px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
.note[hidden] { display: none; }
.note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }
.bar { width: min(100%, calc((100vh - 84px) * 16 / 9)); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--bar); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.bar label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
select, button { font: 600 14px var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
select { background: #0f161b; max-width: 52vw; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.hint { margin-left: auto; color: var(--muted); font-size: 13px; }
button.icon { display: inline-grid; place-items: center; padding: 5px; width: 32px; height: 32px; box-sizing: border-box; }
button.icon svg { width: 18px; height: 18px; }
button.icon[hidden] { display: none; }
.page:fullscreen { background: var(--bg); width: 100%; }
.page:-webkit-full-screen { background: var(--bg); width: 100%; }
@media (max-width: 640px) { .hint { display: none; } }
</style>

<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
const params = new URLSearchParams(location.search);
// ================================================================ STAGE kit (unchanged)
// STAGE: a small film-style rendering kit for three.js motion graphics. Classic script; needs a global THREE (core only,
// no addons). It gives every style the same pipeline:
//   - one clock: stage.seek(t) builds the whole frame for time t, so frames can be rendered alone and in any order
//   - accumulation rendering: each frame is the average of N sub-renders, which gives real motion blur, anti-aliasing,
//     true depth of field (the camera moves across a lens aperture) and soft area-light shadows (lights move across
//     their own surface), all without post-process tricks

//     seeded random and noise
// Globals: K (helpers) and registerStyle(). A style is { id, name, ..., render: {...}, build(S) -> { update(t), overlay? } }.

  // arrays; the ease on a key shapes the move INTO that key.

        L(L(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u), L(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);

  // ---------------------------------------------------------------- textures, text, geometry
  // K.canvasTex(1024, 512, (ctx, w, h) => {...}) -> THREE.CanvasTexture (sRGB, mipmapped). Redraw with tex.redraw(fn).
  K.canvasTex = (w, h, draw, opts = {}) => {

  };
  // A flat piece of text living in the 3D world. K.textPlane('Hello', { font: '800 160px "Inter"', color: '#fff',
  // height: 0.5 }) -> Mesh whose world height is `height` units per line. opts: align, lineHeight, glow (emissive
  // multiplier for bloom), lit (use a lit material so it takes shadows), maxWidthPx, letterSpacing (px), pad (px).

    const lines = String(text).split('\n'), lh = (o.lineHeight || 1.12) * px, pad = o.pad == null ? Math.ceil(px * 0.25) : o.pad;
    const m = document.createElement('canvas').getContext('2d'); m.font = font;
    if (o.letterSpacing) m.letterSpacing = o.letterSpacing + 'px';
    const wpx = Math.ceil(Math.max(...lines.map((l) => m.measureText(l).width))) + pad * 2, hpx = Math.ceil(lh * lines.length) + pad * 2;
    const tex = K.canvasTex(wpx, hpx, (ctx) => {
      ctx.font = font; if (o.letterSpacing) ctx.letterSpacing = o.letterSpacing + 'px';
      ctx.textBaseline = 'middle'; ctx.textAlign = o.align || 'center'; ctx.fillStyle = o.color || '#ffffff';
      const x = o.align === 'left' ? pad : o.align === 'right' ? wpx - pad : wpx / 2;
      lines.forEach((l, i) => ctx.fillText(l, x, pad + lh * (i + 0.5)));
    });
    const unit = (o.height || 1) / px, hWorld = hpx * unit, wWorld = wpx * unit; // `height` = world size of the font's px size
    const mat = o.lit
      ? new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.02, roughness: o.roughness == null ? 0.8 : o.roughness, metalness: 0 })
      : new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
    if (o.glow && !o.lit) mat.color.setScalar(o.glow);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wWorld, hWorld), mat);
    mesh.userData.size = [wWorld, hWorld]; mesh.userData.tex = tex;
    return mesh;
  };
  // Box with rounded edges, centred on the origin. r = edge radius, seg = roundness.
  K.roundedBox = (w, h, d, r = 0.05, seg = 6) => {

    const N = 2 * seg + 1, g = new THREE.BoxGeometry(2, 2, 2, N, N, N), p = g.attributes.position, nrm = g.attributes.normal;
    const half = [w / 2 - r, h / 2 - r, d / 2 - r], v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {

      for (let k = 0; k < 3; k++) {

        a[k] = idx <= seg ? -(1 - idx / seg) : (idx - seg - 1) / seg; inner[k] = side * half[k];

    for (let i = 0; i < p.count; i++) {

  K.roundedRect = (w, h, r = 0.05, seg = 8) => {
    const s = new THREE.Shape(), x = w / 2, y = h / 2; r = Math.min(r, x, y);

  // Tube along a list of [x,y,z] points (smooth Catmull-Rom). closed loops allowed.

  const _o = new THREE.Object3D();

  // Code-built lighting environment for reflections and soft fill (replaces an HDRI). K.env(S, { top, horizon,
  // bottom: sky gradient colours; panels: [{ pos:[x,y,z], size:[w,h], color, power }] bright rectangles that face the
  // origin (softboxes, windows, a sun); intensity; background: true to also show it behind the scene; blur }).
  // Metal and glass can only shine if the environment has something bright in it.

    const es = new THREE.Scene();
    const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { top: { value: new THREE.Color(o.top || '#0b0d12') }, hor: { value: new THREE.Color(o.horizon || o.top || '#14171f') }, bot: { value: new THREE.Color(o.bottom || o.horizon || '#050506') }, gain: { value: o.skyPower == null ? 1 : o.skyPower } },
      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vD; uniform vec3 top, hor, bot; uniform float gain; void main(){ float y = normalize(vD).y; vec3 c = y > 0.0 ? mix(hor, top, pow(y, 0.6)) : mix(hor, bot, pow(-y, 0.5)); gl_FragColor = vec4(c * gain, 1.0); }',
    }));
    es.add(sky);

    s.locked = true; audio();
    const ok = s.opts[k] === s.ti;
    { const tb = tiles[k]; tb.userData.hitAt = G.t; wispTo(world(tb, 0.42, 0.05, 0.12), 0.25, 0.15); tintTo(tb.userData.mat, ok ? C.good : C.bad); set(tb.userData.mat, 1); snd.play('tock', { gain: 0.5, f: 760 }); }
    const ck = s.opts.indexOf(s.ti); if (!ok) { tintTo(tiles[ck].userData.mat, C.good); set(tiles[ck].userData.mat, 1); }
    st.stopRes[st.stop] = ok; mark(ok ? 1 : 0); ok ? (snd.chime('F6', 0.13), snd.right()) : snd.wrong();
    say(ok ? `Correct: ${TERMS[s.ti]}.` : `That is a ${TERMS[s.ti].toLowerCase()}.`, ok ? 'good' : 'bad');
    at(ok ? 1.1 : 2.0, () => { if (st.stop === NS - 1) R5.hlMats = []; finishStop(); });
  }

  // ---------------------------------------------------------------- per frame
  function frame(t) {
    G.t = t; ambient();
    for (let i = 0; i < st.events.length; i++) { const e = st.events[i]; if (t >= e.t) { st.events.splice(i--, 1); e.fn(); } }
    if (st.fly) {
      const f = st.fly, k = f.keys, e = t - f.t0; let j = 1; while (j < k.length - 1 && e > k[j][0]) j++;
      G.tau = K.lerp(k[j - 1][1], k[j][1], K.clamp((e - k[j - 1][0]) / (k[j][0] - k[j - 1][0])));
      if (e >= k[k.length - 1][0]) { st.fly = null; f.then && f.then(); }
    }
    if (G.mode === 'finale') { G.endTau = Math.min(T.end, T.lift + (t - st.endStart)); if (G.endTau >= T.end - 1.2) { G.mode = 'summary'; st.sumAt = t; saveBest(); } }
    if (G.mode === 'summary') { G.endTau = T.end; G.summaryFade = K.seg(t, st.sumAt, st.sumAt + 0.8); }
    const s = st.sub;
    // the wisp drifts back to its resting place when nothing has happened for a while
    if (G.mode === 'play' && WS.free && t > WS.t0 + WS.dur + 2.5 && !(s && s.kind === 'rhythm' && s.phase !== 'ready' && s.phase !== 'result')) wispTo(restOf(st.stop), 0.6, 0.15);
  }

  // ---------------------------------------------------------------- input
  const ray = new THREE.Raycaster();
  function pickAt(ndc) { ray.setFromCamera(ndc, S.camera); const hit = ray.intersectObjects(picks, false).find((h) => { let o = h.object; while (o) { if (!o.visible) return false; o = o.parent; } return true; }); return hit ? hit.object.userData.pick : null; }
  function hitBtn(px, py) { for (let i = st.btns.length - 1; i >= 0; i--) { const b = st.btns[i]; if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return i; } return -1; }
  function pointer(type, px, py, ndc) {
    const s = st.sub;
    if (type === 'move') {
      if (s && s.kind === 'write' && s.drag) { ray.setFromCamera(ndc, S.camera); writeAt(facePoint(ray.ray), false); return true; }
      st.hover = hitBtn(px, py); if (st.hover >= 0) return true;
      return G.mode === 'play' && !!pickAt(ndc);
    }
    if (type === 'up') {
      if (s && s.kind === 'write' && s.drag) { ray.setFromCamera(ndc, S.camera); writeAt(facePoint(ray.ray), true); s.drag = null; drawWritten(); }
      return;
    }
    // down
    audio();
    const bi = hitBtn(px, py); if (bi >= 0) { const b = st.btns[bi]; if (!b.off) { snd.play('click', { gain: 0.5, f: 1397 }); b.fn(); } return; }
    if (G.mode !== 'play' || !s) return;
    if (s.kind === 'rhythm' && (s.phase === 'tap' || s.phase === 'count')) { rhythmTap(); return; }  // anywhere counts as the drum
    const p = pickAt(ndc); if (!p) return;
    if (p.kind === 'drum' && s.kind === 'rhythm') { rhythmTap(); if (s.phase === 'ready') say('That is the drum. Press Tap it (or the Count in sign) to start, then tap on every note.'); }
    else if (p.kind === 'countin' && s.kind === 'rhythm') { if (s.phase === 'ready') runRhythm(true); }
    else if (p.kind === 'scroll' && s.kind === 'rhythm') { if (s.phase === 'ready') runRhythm(false); }
    else if (p.kind === 'gem') touchGem(p.idx);
    else if (p.kind === 'tray' && s.kind === 'write' && !s.locked) { s.drag = { free: true, x: R3.home.x, y: R3.home.y }; s.p = null; drawWritten(); snd.play('paper', { gain: 0.6, dur: 0.2 }); }
    else if (p.kind === 'page' && s.kind === 'write' && !s.locked) { ray.setFromCamera(ndc, S.camera); writeAt(facePoint(ray.ray), true); }
    else if (p.kind === 'seal') setSeal(p.acc);
    else if (p.kind === 'shield') strike(p.k);
    else if (p.kind === 'card') pickCard(p.k);
  }
  function keydown(e) {
    const s = st.sub, k = e.key;
    if (G.mode === 'title' && (k === 'Enter' || k === ' ')) { e.preventDefault(); begin(); return; }
    if (G.mode !== 'play' || !s) return;
    if (s.kind === 'rhythm') {
      if (k === ' ' || e.code === 'Space') { e.preventDefault(); if (s.phase === 'ready') runRhythm(true); else rhythmTap(); }
      else if (k === 'Enter' && s.phase === 'result') { e.preventDefault(); nextRhythm(); }
      else if (k === 'l' || k === 'L') runRhythm(false);
    } else if (s.kind === 'finger') { if (k === 'Enter') { e.preventDefault(); s.waitNext ? nextFinger() : checkFinger(); } else if (/^[1-9]$/.test(k) && R2.gems[+k - 1]) touchGem(+k - 1); }
    else if (s.kind === 'write') {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); if (s.locked) return; s.p = s.p == null ? 2 : K.clamp(s.p + (k === 'ArrowUp' ? 0.5 : -0.5), -3, 7); drawWritten(); }
      else if (k === 'Enter') { e.preventDefault(); checkWrite(); } else if (k === 'b') setSeal(-1); else if (k === '#' || k === 's') setSeal(1);
    }
    else if (s.kind === 'read' && /^[1-3]$/.test(k)) strike(+k - 1);
    else if (s.kind === 'terms' && /^[1-8]$/.test(k)) pickCard(+k - 1);
  }

  // ---------------------------------------------------------------- the painted HUD (on the stage's overlay layer)
  function drawHud(ctx, t, W, H, { TITLE, OPEN_LINE, VERSION }) {
    st.btns = [];
    // the release number, small in the top-left corner on every screen
    ctx.font = `700 ${H * 0.025}px "Alegreya"`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.lineWidth = H * 0.005; ctx.strokeStyle = 'rgba(30,16,60,0.7)'; ctx.strokeText('v' + VERSION, H * 0.024, H * 0.019);
    ctx.fillStyle = 'rgba(255,233,188,0.85)'; ctx.fillText('v' + VERSION, H * 0.024, H * 0.019);
    const scroll = (x, y, w, h, fill, edge) => {
      const n = h * 0.3, path = (i) => { ctx.beginPath(); ctx.moveTo(x - n + i, y + i); ctx.lineTo(x + w + n - i, y + i); ctx.lineTo(x + w - i * 0.4, y + h / 2); ctx.lineTo(x + w + n - i, y + h - i); ctx.lineTo(x - n + i, y + h - i); ctx.lineTo(x + i * 0.4, y + h / 2); ctx.closePath(); };
      path(0); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = Math.max(2, H * 0.0028); ctx.stroke();
      const i = Math.max(4, H * 0.006); ctx.beginPath(); ctx.moveTo(x + i, y + i); ctx.lineTo(x + w - i, y + i); ctx.moveTo(x + i, y + h - i); ctx.lineTo(x + w - i, y + h - i); ctx.lineWidth = Math.max(1, H * 0.0012); ctx.stroke();
    };
    const wrap = (text, max) => {
      const words = text.split(' '), lines = []; let line = '';
      for (const w of words) { const tryL = line ? line + ' ' + w : w; if (ctx.measureText(tryL).width > max && line) { lines.push(line); line = w; } else line = tryL; }
      if (line) lines.push(line); return lines;
    };
    const ribbon = (text, cy, px, maxW, kind) => {
      ctx.font = `700 ${px}px "Alegreya"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lines = wrap(text, maxW), lh = px * 1.22, w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + px * 1.5, h = px * 1.5 + lh * (lines.length - 1);
      scroll(W / 2 - w / 2, cy - h / 2, w, h, kind === 'good' ? '#e3f1d2' : kind === 'bad' ? '#f6d9cf' : C.parch, kind === 'good' ? '#3a7a3a' : kind === 'bad' ? '#9a3a2a' : '#8a6a2a');
      ctx.fillStyle = C.ink; lines.forEach((l, i) => ctx.fillText(l, W / 2, cy - h / 2 + px * 0.79 + lh * i));
      return h;
    };
    // buttons: small purple banners with gold lettering, laid out in a row centred on cx
    const row = (list, cy, cx = W / 2, scale = 1) => {
      const px = H * 0.034 * scale; ctx.font = `700 ${px}px "Texturina"`;
      const ws = list.map((b) => ctx.measureText(b.label).width + px * 1.4), gap = px * 1.1, total = ws.reduce((a, b) => a + b, 0) + gap * (list.length - 1);
      let x = cx - total / 2;
      list.forEach((b, i) => {
        const w = ws[i], h = px * 1.55, y = cy - h / 2, idx = st.btns.length, hov = st.hover === idx && !b.off;
        ctx.globalAlpha = b.off ? 0.45 : 1;
        scroll(x, y, w, h, b.active ? '#c9502a' : hov ? '#5a32a0' : '#3a2070', '#e8c060');
        ctx.fillStyle = '#ffe2a0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.label, x + w / 2, y + h * 0.53);
        ctx.globalAlpha = 1;
        st.btns.push({ x: x - h * 0.3, y, w: w + h * 0.6, h, fn: b.fn, off: b.off });
        x += w + gap;
      });
    };
    const strip = (text, big, alpha) => {
      if (alpha <= 0) return;
      ctx.globalAlpha = alpha;
      const px = H * 0.042, y = H * 0.925;
      ctx.font = `700 ${px}px "Alegreya"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(text).width + px * 1.5;
      scroll(W / 2 - w / 2, y - px * 0.92, w, px * 1.84, C.parch, '#8a6a2a'); ctx.fillStyle = C.ink; ctx.fillText(text, W / 2, y + px * 0.04);
      if (big) { const bp = H * 0.082, top = y - px * 0.92 - bp * 1.72; ctx.font = `700 ${bp}px "Texturina"`; const bw = ctx.measureText(big).width + bp * 1.1; scroll(W / 2 - bw / 2, top, bw, bp * 1.5, '#3a2070', '#e8c060'); ctx.fillStyle = '#ffe2a0'; ctx.fillText(big, W / 2, top + bp * 0.79); }
      ctx.globalAlpha = 1;
    };

    if (G.mode === 'title') {
      strip(OPEN_LINE, TITLE, 1);
      ctx.font = `700 ${H * 0.026}px "Alegreya"`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9bc';
      ctx.fillText(`Level 1 · ${st.inst.name} · notes ${pool().map(pretty).join(', ')}`, W / 2, H * 0.62);
      row([{ label: 'Begin', fn: begin }], H * 0.53, W / 2, 1.5);
      const best = (saved.bestPct || {})[st.inst.key];
      if (best && best.some((b) => b != null)) { ctx.font = `700 ${H * 0.022}px "Alegreya"`; ctx.fillStyle = '#d8cfdf'; ctx.fillText('Best: ' + GAMES.map((g, i) => `${g.name} ${best[i] == null ? '–' : best[i] + '%'}`).join(' · '), W / 2, H * 0.665); }
      return;
    }
    if (G.mode === 'play' || G.mode === 'fly') {
      // score and progress, top left
      ctx.font = `700 ${H * 0.03}px "Texturina"`; const sw = ctx.measureText('Correct 100%').width + H * 0.05;
      scroll(H * 0.04, H * 0.03, sw, H * 0.06, '#3a2070', '#e8c060'); ctx.fillStyle = '#ffe2a0'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Correct ' + (st.tallies.some((t) => t.n) ? finalPct() + '%' : '–'), H * 0.06, H * 0.062);
      {
        const n = NS; for (let k = 0; k < n; k++) { const r = k === st.stop && st.sub && st.sub.kind !== 'done' ? null : st.stopRes[k]; ctx.beginPath(); ctx.arc(H * 0.07 + k * H * 0.03, H * 0.125, H * 0.01, 0, 7); ctx.fillStyle = r === true ? C.good : r === false ? C.bad : k === st.stop ? '#ffe2a0' : k < st.stop ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.25)'; ctx.fill(); }
        // island caption on arrival, then the game's own words at the bottom
        const ca = Math.min(K.seg(t, st.captionAt, st.captionAt + 0.3), 1 - K.seg(t, st.captionAt + 2.4, st.captionAt + 2.7));
        strip(`${GAMES[gameOf(G.island)].line} · ${lapOf(G.island) + 1} of 3`, null, ca);
        if (ca <= 0 && st.msg) ribbon(st.msg, H * 0.93, H * 0.03, W * 0.7, st.msgKind);
        const s = st.sub, col = (list) => list.forEach((b, k) => row([b], H * (0.07 + k * 0.08), W * 0.895));
        if (s && s.kind === 'rhythm') {
          const busy = s.phase !== 'ready' && s.phase !== 'result';
          if (s.phase === 'result') col([{ label: 'Next island', fn: nextRhythm }]);
          else col([{ label: 'Listen', fn: () => runRhythm(false), off: busy }, { label: 'Tap it', fn: () => runRhythm(true), off: busy },
            { label: 'Tempo ' + st.bpm, off: busy, fn: () => { st.bpm = st.bpm === 50 ? 80 : st.bpm === 80 ? 120 : 50; saved.bpm = st.bpm; persist(); } }]);
          if (s.phase === 'tap' || s.phase === 'count' || s.phase === 'listen') { const b = Math.floor((now() - s.t0) / s.beat); if (b >= 0 && b < 12) { ctx.font = `700 ${H * 0.11}px "Texturina"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffe2a0'; ctx.strokeStyle = '#3a2070'; ctx.lineWidth = H * 0.008; const txt = b < 4 ? String(b + 1) : s.phase === 'listen' ? '♪' : 'Tap!'; ctx.strokeText(txt, W * 0.895, H * 0.4); ctx.fillText(txt, W * 0.895, H * 0.4); } }
        } else if (s && s.kind === 'finger') {
          col(s.waitNext ? [{ label: 'Next', fn: nextFinger }, { label: 'Hear it', fn: () => snd.horn(concert(s.n)) }] : [{ label: 'Check', fn: checkFinger }, { label: 'Hear it', fn: () => { audio(); snd.horn(concert(s.n)); } }]);
        } else if (s && s.kind === 'write') {
          col([{ label: 'Check', fn: checkWrite, off: s.locked }]);
        }
      }
      return;
    }
    if (G.mode === 'summary') {
      const a = G.summaryFade; ctx.globalAlpha = a;
      const y0 = H * 0.635; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `700 ${H * 0.05}px "Texturina"`; ctx.fillStyle = '#ffe2a0'; ctx.fillText(`Level 1 complete · ${finalPct()}% correct`, W / 2, y0);
      ctx.font = `700 ${H * 0.026}px "Alegreya"`;
      GAMES.forEach((g, i) => { const tl = st.tallies[i], x = W / 2 + (i - 2) * W * 0.17; ctx.fillStyle = '#d8cfdf'; ctx.fillText(g.name, x, y0 + H * 0.075); ctx.fillStyle = '#F8B73C'; ctx.fillText(tl && tl.n ? pctOf(tl) + '%' : st.skipped[i] ? 'no chart yet' : 'not played', x, y0 + H * 0.115); });
      ctx.globalAlpha = 1;
      if (a > 0.9) {
        row([{ label: 'Climb again', fn: begin }], H * 0.86);
      }
    }
  }

  return {
    frame, pointer, keydown, drawHud, begin, toTitle, clock: now, startStop, showTerm: termScene,
    setInstrument(k) { st.inst = INST.find((i) => i.key === k) || st.inst; saved.inst = st.inst.key; persist(); toTitle(); },
    get inst() { return st.inst; }, setSound, get sound() { return soundOn; }, st,
  };
}

// ================================================================ player: one continuous loop; the picture follows the game
const K = window.K, style = window.STYLES[window.STYLES.length - 1];
const $ = (id) => document.getElementById(id), canvas = $('view'), noteEl = $('note'), sel = $('inst'), bSnd = $('snd'), bRestart = $('restart'), bFs = $('fs'), page = document.querySelector('.page');
const size = (params.get('size') || '1280x720').split('x').map(Number);
try {
  const S = await K.run(canvas, style, { samples: 2, width: size[0], height: size[1] });
  const GAME = window.GAME;
  INST.forEach((i) => { const o = document.createElement('option'); o.value = i.key; o.textContent = i.name; sel.append(o); });
  sel.value = GAME.inst.key;
  sel.addEventListener('change', () => { GAME.setInstrument(sel.value); canvas.focus(); });
  const syncSnd = () => { bSnd.setAttribute('aria-pressed', String(GAME.sound)); bSnd.textContent = GAME.sound ? 'Sound on' : 'Sound off'; };
  bSnd.addEventListener('click', () => { GAME.setSound(!GAME.sound); syncSnd(); }); syncSnd();
  bRestart.addEventListener('click', () => { GAME.toTitle(); canvas.focus(); });

  // full screen: the whole page (stage and bar), so the controls and the way out stay on screen
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    bFs.hidden = false;
    const syncFs = () => {
      const on = !!fsEl(), lab = on ? 'Exit full screen' : 'Full screen';
      bFs.setAttribute('aria-label', lab); bFs.title = lab;
      bFs.querySelector('.enter').style.display = on ? 'none' : '';
      bFs.querySelector('.exit').style.display = on ? '' : 'none';
    };
    bFs.addEventListener('click', async () => {
      try {
        if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else await (page.requestFullscreen || page.webkitRequestFullscreen).call(page);
      } catch (err) {}
      canvas.focus();
    });
    document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
  }

  let live = +(params.get('live') || 2), slow = 0;
  const t0 = performance.now();
  const loop = () => {
    const t = (performance.now() - t0) / 1000;
    GAME.frame(t);
    const a = performance.now(); S.seek(t, live);
    // a machine that cannot keep up gets fewer sub-renders per frame
    if (performance.now() - a > 40) { if (++slow > 10 && live > 1) { live--; slow = 0; } } else slow = Math.max(0, slow - 1);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  const at = (e) => { const r = canvas.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height; return [u * S.W, v * S.H, new THREE.Vector2(u * 2 - 1, -(v * 2 - 1))]; };
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.focus(); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} GAME.pointer('down', ...at(e)); });
  canvas.addEventListener('pointermove', (e) => { canvas.style.cursor = GAME.pointer('move', ...at(e)) ? 'pointer' : 'default'; });
  canvas.addEventListener('pointerup', (e) => GAME.pointer('up', ...at(e)));
  canvas.addEventListener('pointercancel', (e) => GAME.pointer('up', ...at(e)));
  addEventListener('keydown', (e) => { if (e.target === sel || e.target.tagName === 'BUTTON') return; GAME.keydown(e); });
  noteEl.hidden = true; canvas.focus();
  window.READY = true;

  // GitHub Pages lets browsers keep a page for ten minutes; if a newer release is up, fetch it and reload once
  if (/github\.io$/.test(location.hostname)) {
    fetch(location.href.split('#')[0], { cache: 'reload' }).then((r) => r.text()).then((src) => {
      const m = src.match(/const VERSION = (\d+);/), v = m ? +m[1] : 0, key = 'be-realm-reloaded';
      let tried = null; try { tried = sessionStorage.getItem(key); } catch (e) {}
      if (v > window.GAME_VERSION && tried !== String(v)) { try { sessionStorage.setItem(key, String(v)); } catch (e) {} location.reload(); }
    }).catch(() => {});
  }
} catch (err) {
  noteEl.textContent = 'This game needs WebGL 2, which did not start in this browser.';
  window.READY = { error: String(err && err.stack || err) };
  console.error(err);
}
</script>
